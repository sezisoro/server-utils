[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.6,<0.14" ]

[project]
name = "libs"
version = "0.1.0"
description = "Mostly media classification libs"
readme = "README.md"
authors = [ { name = "sez", email = "sezisoro@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []
scripts.exporter = "scripts:deluge_hook_exporter"

[dependency-groups]
dev = [
  "pyfakefs>=6.2",
  "pytest>=9.2",
]

[tool.pytest]
ini_options.log_cli = true
ini_options.log_cli_level = "DEBUG"
ini_options.log_cli_format = "%(asctime)s %(levelname)s %(message)s"
ini_options.log_cli_date_format = "%Y-%m-%d %H:%M:%S"
# ini_options.log_file = "logs/pytest-logs.txt"
